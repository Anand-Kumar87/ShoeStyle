<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#a3e635" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#22c55e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Neon Lime Glow Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d" />
      <stop offset="50%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#bef264" />
    </linearGradient>

    <!-- White Sole Gradient -->
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#84cc16" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Circular Outer Container with Metallic Border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#rimGrad)" stroke-width="6" opacity="0.8" />

  <!-- Sneaker Silhouette Group with Glow -->
  <g filter="url(#neonGlow)">
    <!-- Aerodynamic Speed Line at Base -->
    <path d="M 120 380 Q 260 385 410 380 Q 300 395 120 380 Z" fill="url(#limeGrad)" opacity="0.7" />

    <!-- Outsole (Bottom Curve) -->
    <path d="M 110 355 
             C 120 375, 170 380, 240 372 
             C 320 362, 380 348, 420 325 
             C 415 315, 395 310, 360 318 
             C 290 334, 210 348, 140 342 
             C 120 340, 110 345, 110 355 Z" 
          fill="url(#soleGrad)" />

    <!-- Midsole Neon Accent Strip -->
    <path d="M 125 338 
             C 180 344, 270 330, 370 305 
             C 390 300, 415 305, 410 316 
             C 365 335, 290 350, 215 358 
             C 165 362, 130 355, 125 338 Z" 
          fill="url(#limeGrad)" />

    <!-- Sneaker Upper Body -->
    <path d="M 130 330 
             C 145 305, 195 260, 240 215 
             C 255 200, 265 175, 275 145 
             C 285 170, 305 185, 320 200 
             C 340 180, 345 155, 355 130 
             C 365 175, 375 220, 395 240 
             C 415 260, 425 285, 415 305 
             C 350 330, 260 340, 130 330 Z" 
          fill="#0f172a" 
          stroke="url(#limeGrad)" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Upper Body Wave Accents (Speed Ribs) -->
    <path d="M 200 295 Q 260 260 325 220" 
          stroke="#ffffff" 
          stroke-width="9" 
          stroke-linecap="round" 
          fill="none" />

    <path d="M 175 310 Q 240 280 345 240" 
          stroke="url(#limeGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          fill="none" />

    <path d="M 235 280 Q 295 245 360 265" 
          stroke="#ffffff" 
          stroke-width="7" 
          stroke-linecap="round" 
          fill="none" />

    <!-- Lace Eyelets -->
    <circle cx="260" cy="205" r="5" fill="url(#limeGrad)" />
    <circle cx="245" cy="225" r="5" fill="url(#limeGrad)" />
    <circle cx="230" cy="245" r="5" fill="url(#limeGrad)" />
    <circle cx="215" cy="265" r="5" fill="url(#limeGrad)" />

    <!-- Dynamic Swoosh / Speed Wave -->
    <path d="M 180 320 C 260 310, 330 260, 390 220 C 350 250, 270 295, 180 320 Z" 
          fill="url(#limeGrad)" />
  </g>
</svg>
